<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Tab branding: theme-aware CLIRevenue logo. Dark/light variants use
         media queries so the browser picks the correct one before any JS runs.
         Sizes are declared per candidate so the browser picks by size instead
         of by document order; favicon.ico carries 16/32/48 for legacy tab and
         bookmark fallbacks. All variants are derived from the dark/light
         brand PNGs with their aspect ratios and opaque fields intact. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/clirevenue-favicon-dark.png" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/clirevenue-favicon-light.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/clirevenue-favicon-dark.png" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/clirevenue-favicon-light.png" media="(prefers-color-scheme: light)" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/clirevenue-favicon-dark.png" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/clirevenue-favicon-light.png" media="(prefers-color-scheme: light)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <!-- The boot's two brand files, preloaded. They are the first thing
         the opening sequence shows, and without this the request for
         ~800KB of PNG cannot start until the bundle has parsed and React
         has mounted — by which point the timeline is already running.
         Declaring them here starts both fetches during HTML parse, in
         parallel with the bundle, so each asset is resident and decoded
         well before its beat. `fetchpriority="high"` matches the order
         they appear in: the mark lands first, the wordmark second.
         Preload dark mark by default; light mark will load on theme switch. -->
    <link rel="preload" as="image" href="/brand/clirevenue-logo-dark.png" fetchpriority="high" />
    <link rel="preload" as="image" href="/brand/clirevenue-wordmark.png" />
    <meta
      name="description"
      content="CLIRevenue — a dedicated advertising slot above the command line, with shared revenue for advertisers, users, developers, and the platform."
    />
    <title>CLIRevenue — turn terminal attention into shared revenue</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
